<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9ef">
  <title>BrainPlayMemory – Nájdi rovnaký obrázok</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #273445; background: #fff9ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .wrap { max-width: 1100px; margin: auto; padding: 22px 18px 42px; }
    header { text-align: center; }
    .brand { font-size: 1.12rem; font-weight: 800; color: #315d74; letter-spacing: .02em; }
    h1 { font-size: clamp(1.65rem, 4vw, 2.55rem); margin: 20px 0 10px; }
    .intro { font-size: 1.08rem; line-height: 1.5; margin: 0 auto 20px; max-width: 680px; }
    .languages { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 18px 0 24px; }
    button { font: inherit; cursor: pointer; }
    .language { min-width: 72px; padding: 11px 16px; border: 2px solid #557e90; background: white; border-radius: 12px; font-weight: 800; color: #254b5d; }
    .language[aria-pressed="true"] { background: #315d74; color: white; }
    button:focus-visible, a:focus-visible { outline: 4px solid #c46d0a; outline-offset: 3px; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .card { border-radius: 22px; padding: 24px 19px; border: 1px solid #d8d8d0; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 12px #29394a12; }
    .trees { background: #e6f3e5; } .vegetables { background: #fff0d9; }
    .fruit { background: #ffe7e9; } .animals { background: #e9ecff; }
    .cars { background: #e2f4fa; } .toys { background: #f4e7fa; }
    .emoji { font-size: clamp(2.25rem, 4vw, 3rem); letter-spacing: .05em; line-height: 1.5; white-space: nowrap; }
    h2 { font-size: 1.45rem; margin: 12px 0 8px; }
    .description { line-height: 1.5; margin: 0 0 18px; flex: 1; }
    .play { display: inline-block; width: 100%; max-width: 200px; padding: 13px 16px; border-radius: 13px; background: #245c79; color: white; font-size: 1.12rem; font-weight: 800; text-decoration: none; }
    .play:hover { background: #16435a; }
    .bottom { display: flex; justify-content: center; margin-top: 30px; }
    .home { border: 2px solid #315d74; border-radius: 13px; background: white; color: #234d60; padding: 12px 22px; font-weight: 800; }
    footer { text-align: center; margin-top: 26px; color: #526270; font-size: .92rem; }
    @media (max-width: 850px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 570px) { .cards { grid-template-columns: 1fr; } .card { padding: 19px; } .wrap { padding: 18px 14px 32px; } }
    @media (prefers-reduced-motion: no-preference) { .play, .language, .home { transition: background-color .15s; } }
  </style>
</head>
<body>
  <main class="wrap" id="home">
    <header>
      <div class="brand">BrainPlayMemory</div>
      <h1 id="heading">Nájdi rovnaký obrázok</h1>
      <p class="intro" id="intro">Vyber si tému a zahraj sa. Pozorne sleduj obrázky a nájdi rovnaký.</p>
      <nav class="languages" aria-label="Language / Jazyk / Lingua">
        <button type="button" class="language" data-lang="sk" aria-pressed="true">SK</button>
        <button type="button" class="language" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" class="language" data-lang="it" aria-pressed="false">IT</button>
      </nav>
    </header>
    <section class="cards" id="cards" aria-label="Hry"></section>
    
    <footer>© BrainPlayMemory</footer>
<!-- Priestor pre budúcu reklamu – zatiaľ skrytý -->
<div id="adSpace" hidden></div>
  </main>
  <script>
    'use strict';
    const games = [
      { key: 'trees', emojis: '🌲 🍁 🌴', url: 'https://najdi-rovnaky-obrazok-stromy.netlify.app' },
      { key: 'vegetables', emojis: '🥕 🍅 🥦', url: 'https://najdi-rovnaky-obrazok-zelenina.netlify.app' },
      { key: 'fruit', emojis: '🍓 🍌 🍎', url: 'https://najdi-rovnaky-obrazok-ovocie.netlify.app' },
      { key: 'animals', emojis: '🐰 🐸 🐶', url: 'https://najdi-rovnaky-obrazok-zvieratka.netlify.app' },
      { key: 'cars', emojis: '🚒 🚓 🚕', url: 'https://najdi-rovnaky-obrazok-auticka.netlify.app' },
      { key: 'toys', emojis: '⚽ 🎈 🧸', url: 'https://najdi-rovnaky-obrazok-hracky.netlify.app' }
    ];
    const translations = {
      sk: {
        heading: 'Nájdi rovnaký obrázok',
        intro: 'Vyber si tému a zahraj sa. Pozorne sleduj obrázky a nájdi rovnaký.',
        play: 'Hrať', home: 'Domov', section: 'Výber hier',
        games: {
          trees: ['Stromy', 'Spoznávaj stromy a precvičuj si pozornosť.'],
          vegetables: ['Zelenina', 'Objavuj zeleninu a hľadaj rovnaké obrázky.'],
          fruit: ['Ovocie', 'Zahraj sa s ovocím a precvičuj si postreh.'],
          animals: ['Zvieratká', 'Pozoruj zvieratká a nájdi rovnaký obrázok.'],
          cars: ['Autíčka', 'Sleduj vozidlá a trénuj pozornosť.'],
          toys: ['Hračky', 'Hraj sa s hračkami a hľadaj zhodné obrázky.']
        }
      },
      en: {
        heading: 'Find the Matching Picture',
        intro: 'Choose a theme and play. Look carefully at the pictures and find the matching one.',
        play: 'Play', home: 'Home', section: 'Choose a game',
        games: {
          trees: ['Trees', 'Explore trees and practice paying attention.'],
          vegetables: ['Vegetables', 'Discover vegetables and find matching pictures.'],
          fruit: ['Fruit', 'Play with fruit and practice spotting details.'],
          animals: ['Animals', 'Look at the animals and find the matching picture.'],
          cars: ['Vehicles', 'Look at vehicles and practice paying attention.'],
          toys: ['Toys', 'Play with toys and find matching pictures.']
        }
      },
      it: {
        heading: 'Trova l’immagine uguale',
        intro: 'Scegli un tema e gioca. Osserva attentamente le immagini e trova quella uguale.',
        play: 'Gioca', home: 'Home', section: 'Scegli un gioco',
        games: {
          trees: ['Alberi', 'Scopri gli alberi ed esercita l’attenzione.'],
          vegetables: ['Verdure', 'Scopri le verdure e trova le immagini uguali.'],
          fruit: ['Frutta', 'Gioca con la frutta ed esercita lo spirito di osservazione.'],
          animals: ['Animali', 'Osserva gli animali e trova l’immagine uguale.'],
          cars: ['Veicoli', 'Osserva i veicoli ed esercita l’attenzione.'],
          toys: ['Giocattoli', 'Gioca con i giocattoli e trova le immagini uguali.']
        }
      }
    };
    let currentLanguage = 'sk';
    function render(language) {
      currentLanguage = translations[language] ? language : 'sk';
      const t = translations[currentLanguage];
      document.documentElement.lang = currentLanguage;
      document.title = 'BrainPlayMemory – ' + t.heading;
      document.getElementById('heading').textContent = t.heading;
      document.getElementById('intro').textContent = t.intro;
      
      document.getElementById('cards').setAttribute('aria-label', t.section);
      document.querySelectorAll('.language').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === currentLanguage));
      });
      const cards = document.getElementById('cards');
      cards.replaceChildren();
      for (const game of games) {
        const card = document.createElement('article');
        card.className = 'card ' + game.key;
        const emoji = document.createElement('div');
        emoji.className = 'emoji';
        emoji.setAttribute('aria-hidden', 'true');
        emoji.textContent = game.emojis;
        const title = document.createElement('h2');
        title.textContent = t.games[game.key][0];
        const description = document.createElement('p');
        description.className = 'description';
        description.textContent = t.games[game.key][1];
        const link = document.createElement('a');
        link.className = 'play';
        link.href = game.key === 'trees'
          ? 'stromy.html?lang=' + encodeURIComponent(currentLanguage)
          : game.key === 'vegetables'
          ? 'zelenina.html?lang=' + encodeURIComponent(currentLanguage)
          : game.key === 'fruit'
          ? 'ovocie.html?lang=' + encodeURIComponent(currentLanguage)
          : game.key === 'animals'
          ? 'zvieratka.html?lang=' + encodeURIComponent(currentLanguage)
          : game.key === 'cars'
          ? 'auticka.html?lang=' + encodeURIComponent(currentLanguage)
          : game.key === 'toys'
          ? 'hracky.html?lang=' + encodeURIComponent(currentLanguage)
          : game.url;
        link.textContent = t.play;
        link.setAttribute('aria-label', t.play + ' – ' + t.games[game.key][0]);
        card.append(emoji, title, description, link);
        cards.append(card);
      }
    }
    document.querySelectorAll('.language').forEach(button => {
      button.addEventListener('click', () => render(button.dataset.lang));
    });
    
    const returnLanguage = new URLSearchParams(window.location.search).get('lang');
    render(['sk', 'en', 'it'].includes(returnLanguage) ? returnLanguage : 'sk');
  </script>
</body>
</html>
