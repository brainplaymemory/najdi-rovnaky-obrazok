<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BrainPlayMemory – Nájdi rovnaký obrázok</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4efe6;
      color: #444;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .start-screen p {
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      font-family: Arial, sans-serif;
      cursor: pointer;
      border: none;
    }

    .start-button {
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #7aa67a;
      color: white;
      margin-top: 20px;
    }

    .difficulty {
      margin: 25px 0 10px;
    }

    .difficulty-title {
      font-size: 17px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .difficulty button {
      padding: 12px 16px;
      margin: 5px;
      border-radius: 10px;
      background: #eee;
      color: #444;
      font-size: 16px;
    }

    .difficulty button.active {
      background: #7aa67a;
      color: white;
    }

    .last-result {
      min-height: 35px;
      margin-top: 20px;
      font-size: 19px;
      font-weight: bold;
    }

    .game {
      display: none;
    }

    .target-label {
      font-size: 18px;
      margin-top: 20px;
    }

    .target {
      width: 190px;
      height: 190px;
      margin: 15px auto 30px;
      border-radius: 20px;
      background: #f7f3eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 105px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .choices {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      max-width: 520px;
      margin: 0 auto;
    }

    .choice {
      width: 90px;
      height: 90px;
      border-radius: 18px;
      background: #eef3f0;
      font-size: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .choice:hover {
      transform: scale(1.03);
    }

    .choice.correct {
      background: #d7ead7;
      box-shadow: 0 0 0 4px #7aa67a;
    }

    .message {
      min-height: 55px;
      margin-top: 20px;
      font-size: 21px;
      font-weight: bold;
    }

    .progress {
      margin-top: 15px;
      font-size: 16px;
    }

    /* KONFETY */

    .confetti {
      position: fixed;
      width: 10px;
      height: 14px;
      top: -20px;
      z-index: 9999;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
        padding: 22px 12px;
      }

      h1 {
        font-size: 25px;
      }

      .target {
        width: 160px;
        height: 160px;
        font-size: 85px;
        margin-bottom: 25px;
      }

      .choices {
        gap: 10px;
        max-width: 330px;
      }

      .choice {
        width: 75px;
        height: 75px;
        font-size: 42px;
        border-radius: 14px;
      }

      .difficulty button {
        padding: 10px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ÚVODNÁ OBRAZOVKA -->

    <div class="start-screen" id="startScreen">

      <h1>🧩 Nájdi rovnaký obrázok</h1>

      <div class="subtitle">
        BrainPlayMemory
      </div>

      <p>
        Pozri sa pozorne a vyber obrázok,<br>
        ktorý je rovnaký.
      </p>

      <div class="difficulty">

        <div class="difficulty-title">
          Vyber si náročnosť:
        </div>

        <button class="active" data-level="3">
          🟢 Ľahká – 3
        </button>

        <button data-level="4">
          🟡 Stredná – 4
        </button>

        <button data-level="5">
          🔴 Ťažká – 5
        </button>

      </div>

      <div class="last-result" id="lastResult"></div>

      <button class="start-button" id="startButton">
        ▶ Začni hru
      </button>

    </div>


    <!-- HRA -->

    <div class="game" id="game">

      <h1>🧩 Nájdi rovnaký obrázok</h1>

      <div class="progress" id="progress">
        Úloha 1 z 10
      </div>

      <div class="target-label">
        Ktorý obrázok je rovnaký?
      </div>

      <div class="target" id="target"></div>

      <div class="choices" id="choices"></div>

      <div class="message" id="message"></div>

    </div>

  </div>


  <script>

    const animals = [
      "🐶",
      "🐱",
      "🐰",
      "🦊",
      "🐻",
      "🐼",
      "🐸",
      "🐵"
    ];

    const totalQuestions = 10;

    let level = 3;
    let question = 0;
    let score = 0;
    let currentAnimal = "";


    const startScreen =
      document.getElementById("startScreen");

    const game =
      document.getElementById("game");

    const startButton =
      document.getElementById("startButton");

    const target =
      document.getElementById("target");

    const choices =
      document.getElementById("choices");

    const message =
      document.getElementById("message");

    const progress =
      document.getElementById("progress");

    const lastResult =
      document.getElementById("lastResult");

    const difficultyButtons =
      document.querySelectorAll(".difficulty button");


    /* VÝBER NÁROČNOSTI */

    difficultyButtons.forEach(button => {

      button.addEventListener("click", () => {

        difficultyButtons.forEach(b =>
          b.classList.remove("active")
        );

        button.classList.add("active");

        level = Number(button.dataset.level);

      });

    });


    /* ZAČNI HRU */

    startButton.addEventListener("click", startGame);


    function startGame() {

      question = 0;
      score = 0;

      removeConfetti();

      lastResult.textContent = "";

      startScreen.style.display = "none";

      game.style.display = "block";

      newQuestion();

    }


    /* NOVÁ ÚLOHA */

    function newQuestion() {

      message.textContent = "";

      progress.textContent =
        `Úloha ${question + 1} z ${totalQuestions}`;

      choices.innerHTML = "";


      const shuffledAnimals =
        [...animals].sort(() => Math.random() - 0.5);


      const selected =
        shuffledAnimals.slice(0, level);


      currentAnimal =
        selected[
          Math.floor(Math.random() * selected.length)
        ];


      target.textContent =
        currentAnimal;


      selected
        .sort(() => Math.random() - 0.5)
        .forEach(animal => {

          const button =
            document.createElement("button");

          button.className = "choice";

          button.textContent = animal;


          button.addEventListener("click", () => {

            checkAnswer(button, animal);

          });


          choices.appendChild(button);

        });

    }


    /* KONTROLA ODPOVEDE */

    function checkAnswer(button, animal) {

      const allButtons =
        document.querySelectorAll(".choice");


      allButtons.forEach(b => {
        b.disabled = true;
      });


      if (animal === currentAnimal) {

        button.classList.add("correct");

        message.textContent =
          "⭐ Správne!";

        score++;


        setTimeout(() => {

          question++;


          if (question >= totalQuestions) {

            showResult();

          } else {

            newQuestion();

          }

        }, 900);


      } else {

        message.textContent =
          "🔄 Skús ešte raz";


        allButtons.forEach(b => {
          b.disabled = false;
        });


        button.disabled = true;

      }

    }


    /* KONIEC HRY */

    function showResult() {

      game.style.display = "none";

      startScreen.style.display = "block";


      lastResult.textContent =
        `Výsledok: ${score} z ${totalQuestions}`;


      if (score === totalQuestions) {

        lastResult.textContent =
          "🎉 Výborne! Vyriešil/a si všetkých 10 úloh!";

        createConfetti();

      }

    }


    /* KONFETY */

    function createConfetti() {

      const pieces = 100;


      for (let i = 0; i < pieces; i++) {

        const confetti =
          document.createElement("div");


        confetti.className =
          "confetti";


        confetti.style.left =
          Math.random() * 100 + "vw";


        confetti.style.animationDuration =
          (2 + Math.random() * 3) + "s";


        confetti.style.background =
          [
            "#7aa67a",
            "#c69b63",
            "#f2c94c",
            "#8fb8d8",
            "#d98b8b",
            "#b49ad9"
          ][
            Math.floor(Math.random() * 6)
          ];


        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(confetti);

      }

    }


    /* ODSTRÁNENIE KONFET */

    function removeConfetti() {

      document
        .querySelectorAll(".confetti")
        .forEach(confetti =>
          confetti.remove()
        );

    }

  </script>

</body>
</html>
